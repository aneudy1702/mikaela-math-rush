<script>
  let seconds = 18.4;
  const timerElem = document.getElementById('game-timer');
  const timerInterval = setInterval(() => {
    seconds += 0.1;
    if (timerElem) {
      const min = Math.floor(seconds / 60);
      const sec = (seconds % 60).toFixed(1);
      timerElem.textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }
  }, 100);

  function handleAnswer(btn, value, isCorrect) {
    const targetSlot = document.getElementById('target-slot');
    const toast = document.getElementById('delight-toast');
    
    if (isCorrect) {
      // Correct explosion of green & success
      btn.classList.remove('bg-surface-container-high');
      btn.classList.add('bg-primary-container', 'text-on-primary-container', 'scale-95');
      if (targetSlot) {
        targetSlot.textContent = value;
        targetSlot.classList.remove('animate-pulse', 'underline');
        targetSlot.classList.add('text-primary-fixed');
      }
      if (toast) {
        toast.classList.remove('hidden');
      }
      setTimeout(() => {
        if (toast) toast.classList.add('hidden');
        btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'scale-95');
        btn.classList.add('bg-surface-container-high');
      }, 1400);
    } else {
      // Soft gentle bounce-miss: no lockouts
      btn.classList.add('bg-error-container', 'text-on-error-container', 'translate-x-1');
      setTimeout(() => {
        btn.classList.remove('translate-x-1');
        btn.classList.add('-translate-x-1');
      }, 75);
      setTimeout(() => {
        btn.classList.remove('-translate-x-1', 'bg-error-container', 'text-on-error-container');
      }, 350);
    }
  }

  // Audio button feedback micro-bounce
  const ttsBtn = document.getElementById('tts-btn');
  if (ttsBtn) {
    ttsBtn.addEventListener('click', () => {
      ttsBtn.classList.add('scale-125', 'text-primary-container');
      setTimeout(() => {
        ttsBtn.classList.remove('scale-125', 'text-primary-container');
      }, 250);
    });
  }
