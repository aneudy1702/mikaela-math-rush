name: Deploy to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: heroku-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl -sL https://cli-assets.heroku.com/install-ubuntu.sh | sh

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${HEROKU_API_KEY:-}" ]; then
            echo "Missing HEROKU_API_KEY secret"
            exit 1
          fi
          APP_NAME="${HEROKU_APP_NAME:-mikaela-math-rush}"
          cat > ~/.netrc <<EOF
          machine api.heroku.com
            login _
            password ${HEROKU_API_KEY}
          machine git.heroku.com
            login _
            password ${HEROKU_API_KEY}
          EOF
          chmod 600 ~/.netrc
          if ! heroku apps:info -a "$APP_NAME" >/dev/null 2>&1; then
            echo "Creating Heroku app: $APP_NAME"
            heroku create "$APP_NAME" --stack heroku-24
            heroku buildpacks:set heroku/nodejs -a "$APP_NAME"
          fi
          heroku git:remote -a "$APP_NAME"
          git push heroku HEAD:main --force
          echo "Deployed: https://${APP_NAME}.herokuapp.com"
