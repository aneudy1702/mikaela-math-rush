name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not secret: identify aneudy-abreus-projects/temporary-sonic-sequoia-hdx3l6n.
  VERCEL_ORG_ID: team_CAdTbIL1yOe85IWqr5vusm7L
  VERCEL_PROJECT_ID: prj_9hHBuuyET53xAvcvlTVC9sH5nvk0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Fork PRs have no access to secrets; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::Missing VERCEL_TOKEN repo secret"
            exit 1
          fi
          npm install --global vercel@latest
          vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          vercel build $PROD --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt $PROD --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
